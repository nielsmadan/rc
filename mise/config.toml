[tools]
node = "24"
ruby = "3.1.2"
python = "3.14.7"
rust = "1.99.0"
java = "zulu-17"
bun = "latest"
deno = "latest"
go = "1.25.3"
fzf = "latest"
pnpm = "latest"
sops = "latest"
age = "latest"
terraform = "latest"
kubectl = "latest"
gh = "latest"
glab = "latest"
just = "latest"
lefthook = "latest"
tart = "latest"
pipx = "latest"
"npm:agent-browser" = "latest"
"npm:firebase-tools" = "latest"
"npm:wrangler" = "latest"
"github:stripe/stripe-cli" = "latest"
"aqua:hashicorp/vault" = "2.0.2"  # aqua's latest resolves broken tags (2.0.1 has no darwin build)
railway = { version = "latest", exe = "railway" }
"npm:typescript-language-server" = "latest"
"npm:agent-device" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"aqua:charmbracelet/vhs" = "latest"
"pipx:mlx-whisper" = "latest"
"pipx:llm" = "latest"
"github:nolabs-ai/nono" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[env]
AGENT_DEVICE_IOS_TEAM_ID = "VED8HFWY84"
AGENT_DEVICE_IOS_BUNDLE_ID = "com.nielsmadan.agentdevice.runner"
# Both default to never reaping: agent-browser skips --cdp-attached browsers, agent-device keeps unclosed sessions
AGENT_DEVICE_SESSION_IDLE_TIMEOUT_MS = "7200000"
AGENT_BROWSER_IDLE_TIMEOUT_MS = "3600000"
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
