// RFP can't be relaxed per site; FPP with all targets is close to RFP and is lifted by the shield's tracking-protection toggle.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets");
// FPP caps WebGL MAX_TEXTURE_SIZE at 2048, which shrinks Figma's canvas to ~1024 CSS px at 2x.
defaultPref("privacy.fingerprintingProtection.granularOverrides", '[{"firstPartyDomain":"figma.com","overrides":"-WebGLRenderCapability"}]');
