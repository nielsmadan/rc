set-option -ga update-environment ' ITERM_SESSION_ID KITTY_WINDOW_ID KITTY_LISTEN_ON KITTY_PID'

# truecolor passthrough (so nvim/harlequin render full color under tmux)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# bigger scrollback, restored after detach/reattach
set -g history-limit 50000

# wheel scrolls tmux history; clicks/drags stay native (the terminal profile
# reports the wheel but not clicks), so selection still hits the real clipboard
set -g mouse on
set -g set-clipboard on
set -ga terminal-features ",*:clipboard"

# ⌘1–⌘9 map to window numbers, so count from 1 and close the gaps
set -g base-index 1
set -g renumber-windows on

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pass Shift+Enter and friends through to agent TUIs as distinct keys
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',*:extkeys'

# Esc reaches the agent immediately instead of waiting for a meta sequence (slow over SSH)
set -s escape-time 10
set -g focus-events on

# the phone and the Mac can each see their own size; the window follows whoever typed last
set -g window-size latest
setw -g aggressive-resize on
