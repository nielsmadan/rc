services:
  engine:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    user: "${VLLM_UID:?}:${VLLM_GID:?}"
    gpus: all
    shm_size: 16gb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?}
      HOME: /cache
      HF_HOME: /hf
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # hf-xet downloads stall forever on an idle connection; plain HTTPS times out and resumes
      HF_HUB_DISABLE_XET: "1"
      VLLM_MAX_N_SEQUENCES: "16"
    volumes:
      - /srv/llm/hf:/hf
      - /srv/llm/cache:/cache
    # NVIDIA's DGX Spark "agent ready" recipe (dgx-spark-playbooks nvidia/vllm), minus --trust-remote-code, plus text-only
    command:
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --revision=1355db6a052410cfd62085d94b58866fd0f2c3c5
      - --served-model-name=qwen3.6-35b-a3b
      - --host=0.0.0.0
      - --port=8000
      - --kv-cache-dtype=fp8
      - --attention-backend=flashinfer
      - --moe-backend=marlin
      - --gpu-memory-utilization=0.4
      - --max-model-len=262144
      - --max-num-seqs=4
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --load-format=fastsafetensors
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_xml
      - --enable-auto-tool-choice
      - --language-model-only
    networks: [llm]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
