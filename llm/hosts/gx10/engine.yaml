services:
  engine:
    image: vllm/vllm-openai:v0.34.0@sha256:20fdb089454afbb324efa4110a2c025ff7b27cc1a086e07aa580b18df8ad1ce1
    user: "${VLLM_UID:?}:${VLLM_GID:?}"
    gpus: all
    shm_size: 16gb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?}
      HOME: /cache
      HF_HOME: /hf
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # hf-xet downloads stall forever on an idle connection; plain HTTPS times out and resumes
      HF_HUB_DISABLE_XET: "1"
      VLLM_MAX_N_SEQUENCES: "16"
    volumes:
      - /srv/llm/hf:/hf
      - /srv/llm/cache:/cache
    # The single-GB10 command from vllm-project/vllm#59958, plus long context, prefix caching and tool calls.
    # disk_offload reads the PLE table from the mmapped checkpoint; --load-format=fastsafetensors makes it fail.
    command:
      - nvidia/Qwen3.8-Flash-Next-NVFP4
      - --revision=fc694b54fb0174e0913e6adf86691ef85a4ead47
      - --served-model-name=qwen3.8-flash-next
      - --host=0.0.0.0
      - --port=8000
      - '--engram-config={"disk_offload": true}'
      - --kv-cache-dtype=fp8
      - --gpu-memory-utilization=0.8
      - --max-model-len=262144
      - --max-num-seqs=4
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - '--compilation-config={"max_cudagraph_capture_size": 32}'
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_xml
      - --enable-auto-tool-choice
      - --language-model-only
    networks: [llm]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
