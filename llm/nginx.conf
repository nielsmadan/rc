# Only the inference API reaches the engine; vLLM's unauthenticated endpoints (/invocations, /pause, /update_weights, ...) stay unreachable.
server {
    listen 8080;
    access_log off;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location ~ ^/v1/(chat/completions|completions|models|messages|messages/count_tokens|responses)$ {
        proxy_pass http://engine:8000;
    }

    location = /health {
        proxy_pass http://engine:8000;
    }

    location / {
        return 404;
    }
}
