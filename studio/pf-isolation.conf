# Loaded by bin/studio-pf into the com.apple/900.studio-isolation anchor.
# Blocks new outbound connections from the Studio to the home network.
lan_v4     = "192.168.178.0/24"
router_v4  = "192.168.178.1"
router_v6  = "{ fe80::2e91:abff:fee6:ad4d, fdb7:75f7:7700::2e91:abff:fee6:ad4d }"
tailnet_v6 = "fd7a:115c:a1e0::/48"

# Keeps state for inbound connections, so their replies pass the blocks below.
pass in all keep state

pass out quick on lo0 all
pass out quick inet proto { udp tcp } to $router_v4 port 53
pass out quick inet proto udp to $router_v4 port 67
pass out quick inet6 proto { udp tcp } to $router_v6 port 53
pass out quick inet6 proto icmp6 icmp6-type { routersol, neighbrsol, neighbradv }
pass out quick inet6 to $tailnet_v6

block return out quick inet to $lan_v4
block return out quick inet6 to { fe80::/10, fc00::/7, (en0:network), (en1:network) }
